<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} | {{APP_NAME}}</title>
<meta property="og:title" content="{{TITLE}}">
<meta property="og:type" content="video.other">
<meta property="og:url" content="{{OG_URL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:site_name" content="{{APP_NAME}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/static/brand/logo.png">
<meta name="theme-color" content="#07080D">
<link rel="stylesheet" href="/static/style.css">
<style>
  .topbar { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 32px; background: rgba(7, 8, 13, .72); border-bottom: 1px solid var(--line); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .topbar .right { display: flex; gap: 8px; align-items: center; }
  .made { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 8px; }
  .made::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 10px var(--brand); }
  .watch { display: grid; grid-template-columns: minmax(0, 1fr) 370px; gap: 30px; max-width: 1400px; margin: 0 auto; padding: 30px 32px 72px; align-items: start; }

  /* Ambient glow: the video's own colors light up the space around it */
  .screen { position: relative; isolation: isolate; }
  .ambient { position: absolute; inset: 2% 3%; z-index: -1; width: 94%; height: 96%; filter: blur(70px) saturate(1.5); opacity: .55; transform: scale(1.08); pointer-events: none; transition: opacity .6s; background: radial-gradient(closest-side, rgba(0, 195, 255, .35), transparent); border-radius: 30px; }
  .player.portrait { aspect-ratio: 9 / 16; width: auto; max-width: 100%; height: min(78vh, 900px); margin: 0 auto; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; display: block; background: #000; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255, 255, 255, .08), 0 30px 80px -30px rgba(0, 0, 0, .9); }

  .ready { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 15px; margin-bottom: 20px; color: #fff;
    background: linear-gradient(90deg, rgba(47, 213, 138, .14), rgba(0, 195, 255, .08)); border: 1px solid rgba(47, 213, 138, .3); }
  .ready > svg { color: var(--ok); width: 22px; height: 22px; }
  .ready .txt { flex: 1; font-weight: 600; }
  .ready .txt small { display: block; font-weight: 400; color: var(--ink-2); }
  .note { padding: 11px 14px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-ink); font-size: 14px; margin-top: 16px; border: 1px solid rgba(0, 195, 255, .25); }
  .title-row { display: flex; align-items: flex-start; gap: 16px; margin-top: 24px; }
  .title-row h1, .title-input { flex: 1; min-width: 0; font: 800 28px/1.18 var(--font); letter-spacing: -0.03em; margin: 0; }
  .title-input { border: 1px solid transparent; border-radius: 11px; padding: 4px 9px; margin-left: -10px; background: transparent; color: var(--ink); width: 100%; }
  .title-input:hover { border-color: var(--line-2); }
  .title-input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); background: rgba(0, 195, 255, .03); }
  .actions { display: flex; gap: 8px; flex: none; position: relative; }
  .byline { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .byline .nm { font-weight: 600; }
  .byline .sm { font-size: 13px; color: var(--muted); }
  .byline .sm .num { color: var(--ink-2); }
  .reacts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 22px; }
  .react { height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, .03); cursor: pointer; display: inline-flex; align-items: center; gap: 7px; font-size: 17px; transition: transform .1s, border-color .15s, background .15s, box-shadow .2s; }
  .react:hover { border-color: rgba(0, 195, 255, .6); background: rgba(0, 195, 255, .06); box-shadow: 0 6px 20px -10px var(--brand-glow); }
  .react:active { transform: scale(.94); }
  .react .n { font: 600 12.5px var(--mono); color: var(--ink-2); }
  .react.burst { animation: burst .35s ease-out; }
  @keyframes burst { 40% { transform: scale(1.18); } }

  .comments { position: sticky; top: 92px; display: flex; flex-direction: column; max-height: calc(100vh - 112px); border-radius: 20px; border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(21, 24, 38, .8), rgba(13, 15, 23, .8)); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05); }
  .comments header { padding: 18px 20px 14px; display: flex; align-items: center; gap: 9px; border-bottom: 1px solid var(--line); }
  .comments header .count { font: 600 12px var(--mono); padding: 2px 8px; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); }
  .clist { flex: 1; overflow-y: auto; padding: 6px 20px; min-height: 130px; }
  .c { display: flex; gap: 11px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .c:last-child { border-bottom: 0; }
  .c .body { flex: 1; min-width: 0; }
  .c .top { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .c .top b { font-weight: 600; font-size: 14px; }
  .c .top .muted { font-size: 12px; }
  .c .del { margin-left: auto; opacity: 0; }
  .c:hover .del, .c .del:focus { opacity: 1; }
  .c p { margin: 5px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .ts { border: 1px solid rgba(0, 195, 255, .35); background: var(--brand-soft); color: var(--brand-ink); font: 600 11.5px var(--mono); padding: 1px 7px; border-radius: 6px; cursor: pointer; margin-right: 7px; }
  .ts:hover { background: rgba(0, 195, 255, .22); }
  .cempty { color: var(--muted); font-size: 14px; text-align: center; padding: 30px 8px; }
  .cform { padding: 14px 20px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
  .cform textarea.input { min-height: 66px; }
  .cform .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .cform label { font-size: 13px; color: var(--ink-2); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .cform label .num { color: var(--brand-ink); }
  .cform input[type=checkbox] { accent-color: var(--brand); }
  .err { color: #FF7A86; font-size: 13px; }
  .missing { max-width: 460px; margin: 14vh auto; text-align: center; padding: 0 16px; }
  .missing p { color: var(--muted); }
  @media (max-width: 1000px) {
    .watch { grid-template-columns: 1fr; padding: 16px 16px 48px; }
    .player.portrait { height: min(72vh, 760px); }
    .actions { width: 100%; }
    .actions #copyBtn { flex: 1; }
    .comments { position: static; max-height: none; }
    .topbar { padding: 12px 16px; }
    .made { display: none; }
    .title-row { flex-direction: column; }
    .title-row h1, .title-input { font-size: 23px; }
  }
  @media (max-width: 480px) {
    .topbar .logo .wm { display: none; }
  }
</style>
</head>
<body data-app="{{APP_NAME}}">
<div class="topbar">
  <a class="logo" href="/"><img src="/static/brand/logo.png" alt=""><span class="wm"><b>MADIFYX</b><small>CLIPS</small></span></a>
  <div class="right" id="topRight"><span class="made">Recorded with {{APP_NAME}}</span></div>
</div>

<div class="watch" id="watch">
  <section>
    <div class="ready hidden" id="ready">
      <svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>
      <div class="txt">Your video is ready to share<small>Give it a title, then copy the link.</small></div>
      <button class="btn ghost sm" id="readyClose" aria-label="Dismiss">Dismiss</button>
    </div>

    <div class="screen">
      <canvas class="ambient" id="ambient" width="32" height="18" aria-hidden="true"></canvas>
      <video id="player" class="player" controls playsinline preload="metadata"></video>
    </div>
    <div class="note hidden" id="processing">Still optimizing this video for every device. It already plays here.</div>

    <div class="title-row">
      <h1 id="title">{{TITLE}}</h1>
      <div class="actions">
        <select class="input" id="speed" aria-label="Playback speed" style="width:auto;height:40px">
          <option value="1">1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="1.75">1.75x</option><option value="2">2x</option>
        </select>
        <button class="btn primary" id="copyBtn"><svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg> Copy link</button>
        <button class="btn icon hidden" id="moreBtn" aria-label="More actions" aria-haspopup="menu"><svg class="i" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/></svg></button>
      </div>
    </div>
    <div class="byline" id="byline"></div>
    <div class="reacts" id="reacts" aria-label="Reactions"></div>
  </section>

  <aside class="comments" aria-labelledby="cHead">
    <header><h2 id="cHead">Comments</h2><span class="count hidden" id="cCount"></span></header>
    <div class="clist" id="clist"><div class="cempty">Loading</div></div>
    <form class="cform" id="cform">
      <input class="input hidden" id="cName" placeholder="Your name" maxlength="60" autocomplete="name">
      <textarea class="input" id="cText" placeholder="Leave a comment" maxlength="1000" required></textarea>
      <div class="err hidden" id="cErr"></div>
      <div class="row">
        <label><input type="checkbox" id="cAt" checked> at <span class="num" id="cAtTime">0:00</span></label>
        <button class="btn primary sm" id="cPost">Post comment</button>
      </div>
    </form>
  </aside>
</div>

<script src="/static/shell.js"></script>
<script>
(async function () {
  const id = '{{ID}}';
  const player = $('player');
  let v, comments = [];
  const res = await fetch('/api/videos/' + id + '/public');
  if (!res.ok) {
    $('watch').outerHTML = '<div class="missing"><h1>This video is gone</h1><p class="muted">It may have been deleted, or the link has a typo. Ask whoever sent it for a new link.</p></div>';
    return;
  }
  v = await res.json();
  const me = v.me;

  // ----- video -----
  if (v.thumb) player.poster = v.thumb;
  player.src = v.src;
  if (v.status === 'processing') $('processing').classList.remove('hidden');
  player.addEventListener('loadedmetadata', () => {
    // Phone videos filmed upright get a tall player instead of black bars
    if (player.videoHeight > player.videoWidth * 1.1) player.classList.add('portrait');
    // Raw browser recordings can report no length until you seek once
    if (player.duration === Infinity) {
      player.currentTime = 1e101;
      player.addEventListener('timeupdate', function fix() { player.removeEventListener('timeupdate', fix); player.currentTime = 0; });
    }
  });
  // Ambient glow: paint a tiny copy of the current frame behind the player
  const amb = $('ambient'), actx = amb.getContext('2d');
  const paint = src => { try { actx.drawImage(src, 0, 0, amb.width, amb.height); } catch (e) {} };
  if (v.thumb) { const im = new Image(); im.onload = () => paint(im); im.src = v.thumb; }
  let ambTimer = null;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  player.addEventListener('play', () => { if (!reduce) ambTimer = setInterval(() => paint(player), 200); });
  player.addEventListener('pause', () => clearInterval(ambTimer));
  player.addEventListener('loadeddata', () => { if (!v.thumb) paint(player); });

  let counted = false;
  player.addEventListener('play', () => {
    if (counted) return; counted = true;
    fetch('/api/videos/' + id + '/view', { method: 'POST' }).then(r => r.json()).then(j => { v.views = j.views; byline(); }).catch(() => {});
  });
  const atLabel = $('cAt').closest('label');
  const syncAt = () => {
    $('cAtTime').textContent = fmtDur(player.currentTime);
    atLabel.style.visibility = player.currentTime > 0.5 ? 'visible' : 'hidden';
  };
  player.addEventListener('timeupdate', syncAt); syncAt();
  $('speed').onchange = e => { player.playbackRate = Number(e.target.value); };
  $('copyBtn').onclick = () => copyText(location.origin + '/v/' + id);

  function byline() {
    $('byline').innerHTML = `${avatar(v.owner, 'lg')}<div><div class="nm">${esc(v.owner || 'Someone')}</div>
      <div class="sm">${ago(v.createdAt)}${v.duration ? ', <span class="num">' + fmtDur(v.duration) + '</span>' : ''}, <span class="num">${v.views}</span> ${v.views === 1 ? 'view' : 'views'}</div></div>`;
  }
  byline();

  // ----- top bar for signed in people -----
  if (me) {
    $('topRight').innerHTML = `<a class="btn ghost" href="/">${icon('library')} Library</a><a class="btn primary" href="/?record=1"><span style="width:9px;height:9px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 2px rgba(255,255,255,.6)"></span> New video</a>`;
  }

  // ----- owner tools -----
  if (v.canEdit) {
    const params = new URLSearchParams(location.search);
    if (params.get('new') === '1') {
      $('ready').classList.remove('hidden');
      history.replaceState(null, '', location.pathname);
    }
    $('readyClose').onclick = () => $('ready').classList.add('hidden');

    const input = document.createElement('input');
    input.className = 'title-input'; input.value = v.title; input.maxLength = 200; input.setAttribute('aria-label', 'Video title');
    $('title').replaceWith(input);
    if (!$('ready').classList.contains('hidden')) { input.focus(); input.select(); }
    const saveTitle = async () => {
      const t = input.value.trim();
      if (!t) { input.value = v.title; return; }
      if (t === v.title) return;
      await api('/api/videos/' + id, 'PATCH', { title: t });
      v.title = t; document.title = t + ' | ' + document.body.dataset.app; toast('Title saved');
    };
    input.addEventListener('blur', saveTitle);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') input.blur(); if (e.key === 'Escape') { input.value = v.title; input.blur(); } });

    $('moreBtn').classList.remove('hidden');
    $('moreBtn').onclick = e => {
      e.stopPropagation();
      const old = document.querySelector('.menu'); if (old) { old.remove(); return; }
      const m = document.createElement('div');
      m.className = 'menu'; m.setAttribute('role', 'menu');
      m.style.top = '46px'; m.style.right = '0';
      m.innerHTML = `<a role="menuitem" href="${esc(v.src)}?download=1">${icon('download')} Download</a>
        <button role="menuitem" class="danger" id="delVid">${icon('trash')} Delete video</button>`;
      $('moreBtn').parentElement.appendChild(m);
      m.querySelector('#delVid').onclick = async () => {
        if (!confirm('Delete this video? The link will stop working for everyone.')) return;
        await api('/api/videos/' + id, 'DELETE');
        location.href = '/';
      };
    };
    document.addEventListener('click', e => { const m = document.querySelector('.menu'); if (m && !m.contains(e.target)) m.remove(); });
  }

  // ----- reactions -----
  const EMOJI = ['\u{1F44D}', '❤️', '\u{1F602}', '\u{1F389}', '\u{1F525}', '\u{1F440}'];
  function renderReacts() {
    $('reacts').innerHTML = EMOJI.map(e => `<button class="react" data-e="${e}" aria-label="React ${e}">${e}${v.reactions[e] ? `<span class="n">${v.reactions[e]}</span>` : ''}</button>`).join('');
  }
  renderReacts();
  $('reacts').addEventListener('click', async e => {
    const b = e.target.closest('.react'); if (!b) return;
    const emoji = b.dataset.e;
    v.reactions[emoji] = (v.reactions[emoji] || 0) + 1;
    renderReacts();
    const nb = $('reacts').querySelector(`[data-e="${emoji}"]`); nb.classList.add('burst');
    try { const j = await api('/api/videos/' + id + '/react', 'POST', { emoji }); v.reactions = j.reactions; renderReacts(); } catch (err) { toast(err.message); }
  });

  // ----- comments -----
  if (!me) {
    $('cName').classList.remove('hidden');
    try { $('cName').value = localStorage.getItem('clips.name') || ''; } catch (e) {}
  }
  function renderComments() {
    $('cCount').textContent = comments.length; $('cCount').classList.toggle('hidden', !comments.length);
    if (!comments.length) { $('clist').innerHTML = '<div class="cempty">No comments yet. Pause on a moment and leave a note.</div>'; return; }
    $('clist').innerHTML = comments.map(c => {
      const canDel = me && (v.canEdit || c.userId === me.id);
      return `<div class="c" data-id="${esc(c.id)}">${avatar(c.name, 'sm')}
        <div class="body">
          <div class="top"><b>${esc(c.name)}</b><span class="muted">${ago(c.at)}</span>
            ${canDel ? `<button class="btn ghost icon sm del" data-del="${esc(c.id)}" aria-label="Delete comment">${icon('x')}</button>` : ''}</div>
          <p>${c.t != null ? `<button class="ts" data-t="${c.t}">${fmtDur(c.t)}</button>` : ''}${esc(c.text)}</p>
        </div></div>`;
    }).join('');
  }
  comments = await api('/api/videos/' + id + '/comments').catch(() => []);
  renderComments();

  $('clist').addEventListener('click', async e => {
    const ts = e.target.closest('.ts');
    if (ts) { player.currentTime = Number(ts.dataset.t); player.play(); return; }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!confirm('Delete this comment?')) return;
      await api(`/api/videos/${id}/comments/${del.dataset.del}`, 'DELETE');
      comments = comments.filter(c => c.id !== del.dataset.del); renderComments();
    }
  });
  $('cText').addEventListener('focus', () => { if (!player.paused) player.pause(); });
  $('cform').addEventListener('submit', async e => {
    e.preventDefault();
    $('cErr').classList.add('hidden');
    const name = $('cName').value.trim();
    if (!me && !name) { $('cErr').textContent = 'Add your name so they know who commented.'; $('cErr').classList.remove('hidden'); $('cName').focus(); return; }
    $('cPost').disabled = true;
    try {
      const c = await api('/api/videos/' + id + '/comments', 'POST', { name, text: $('cText').value, t: $('cAt').checked && player.currentTime > 0.5 ? player.currentTime : null });
      comments.push(c); renderComments();
      $('cText').value = '';
      $('clist').scrollTop = $('clist').scrollHeight;
      try { if (!me) localStorage.setItem('clips.name', name); } catch (err) {}
    } catch (err) { $('cErr').textContent = err.message; $('cErr').classList.remove('hidden'); }
    $('cPost').disabled = false;
  });
})();
</script>
</body>
</html>
